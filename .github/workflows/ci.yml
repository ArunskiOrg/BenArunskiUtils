name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-and-test:
    # ubuntu-slim: pure-Python lint/test job, no Docker, well under 15 minutes, fits in 1 vCPU/5GB
    runs-on: ubuntu-slim
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.9"
      - run: pip install pytest ruff
      - run: ruff check .
      - run: pytest
