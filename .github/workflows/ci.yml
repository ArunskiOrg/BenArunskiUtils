name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-and-test:
    # ubuntu-slim: pure-Python lint/test job, no Docker, well under 15 minutes, fits in 1 vCPU/5GB
    runs-on: ubuntu-slim
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.9"
      - run: pip install pytest ruff pyyaml
      - run: ruff check .
      - run: python scripts/validate_skill_frontmatter.py
      - run: pytest

  lint-and-test-windows:
    # The skills document Windows-specific interpreter and venv paths, so the scripts are exercised on Windows too.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.9"
      - run: pip install pytest ruff pyyaml
      - run: ruff check .
      - run: python scripts/validate_skill_frontmatter.py
      - run: pytest
